name: Build Testing JAR

# Manual only: commits to testing will not automatically trigger a build.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build test JAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout testing branch
        uses: actions/checkout@v4
        with:
          ref: testing

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build mod
        run: gradle build --no-daemon

      - name: Upload test JAR
        uses: actions/upload-artifact@v4
        with:
          name: Sky2M-testing-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
